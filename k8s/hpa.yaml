apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems-backend-hpa
  namespace: ems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ems-backend

  minReplicas: 1
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

