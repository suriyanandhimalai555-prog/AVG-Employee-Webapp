server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ems-backend:4040/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must never be cached — it holds the hashed chunk references,
    # so a stale cached copy will request filenames deleted by the new deploy.
    # Browsers will revalidate on every navigation (ETag/304 keeps it fast).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed assets are immutable: the filename changes on every build, so
    # a 1-year cache is safe and eliminates unnecessary round-trips.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
