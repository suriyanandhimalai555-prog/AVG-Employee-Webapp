version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ems-backend
    restart: always
    env_file:
      - .env
    ports:
      - "4040:4040"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ems-frontend
    restart: always
    ports:
      - "3020:80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ems-worker
    restart: always
    env_file:
      - .env
