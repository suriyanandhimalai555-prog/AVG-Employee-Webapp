name: Build EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ems-build
  cancel-in-progress: false

jobs:

  build:
    name: Build EMS Images
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          build-args: |
            VITE_API_URL=https://ems.avgprimetech.com/api

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

          provenance: false
          sbom: false


