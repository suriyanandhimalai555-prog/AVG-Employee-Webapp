name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ems-production
  cancel-in-progress: false

jobs:

  build:
    name: Build EMS Images
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          build-args: |
            VITE_API_URL=https://ems.avgprimetech.com/api

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

          provenance: false
          sbom: false


  deploy:
    name: Deploy EMS to Kubernetes
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy EMS to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            cd /home/ubuntu/otp/apps/AVG-Employee-Webapp

            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_USER="${{ secrets.GHCR_USERNAME }}"

            echo "=========================================="
            echo "EMS DEPLOYMENT STARTED"
            echo "=========================================="
            echo "Architecture: $(uname -m)"
            echo "Commit: ${IMAGE_TAG}"

            echo ""
            echo "Reading currently running images"

            OLD_BACKEND_IMAGE=$(sudo kubectl -n ems get deployment ems-backend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            OLD_FRONTEND_IMAGE=$(sudo kubectl -n ems get deployment ems-frontend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            OLD_WORKER_IMAGE=$(sudo kubectl -n ems get deployment ems-worker \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Old backend image:  ${OLD_BACKEND_IMAGE}"
            echo "Old frontend image: ${OLD_FRONTEND_IMAGE}"
            echo "Old worker image:   ${OLD_WORKER_IMAGE}"

            echo ""
            echo "=========================================="
            echo "CURRENT DEPLOYMENT STATUS"
            echo "=========================================="

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"


            rollback() {
              echo ""
              echo "=========================================="
              echo "DEPLOYMENT FAILED"
              echo "STARTING AUTOMATIC ROLLBACK"
              echo "=========================================="

              set +e

              echo ""
              echo "Restoring backend image"

              sudo kubectl -n ems set image deployment/ems-backend \
                backend="${OLD_BACKEND_IMAGE}"

              echo ""
              echo "Restoring frontend image"

              sudo kubectl -n ems set image deployment/ems-frontend \
                frontend="${OLD_FRONTEND_IMAGE}"

              echo ""
              echo "Restoring worker image"

              sudo kubectl -n ems set image deployment/ems-worker \
                worker="${OLD_WORKER_IMAGE}"

              echo ""
              echo "Forcing replicas to 1"

              sudo kubectl -n ems scale deployment/ems-backend --replicas=1
              sudo kubectl -n ems scale deployment/ems-frontend --replicas=1
              sudo kubectl -n ems scale deployment/ems-worker --replicas=1

              echo ""
              echo "Waiting for backend rollback"

              sudo kubectl -n ems rollout status deployment/ems-backend \
                --timeout=180s

              echo ""
              echo "Waiting for frontend rollback"

              sudo kubectl -n ems rollout status deployment/ems-frontend \
                --timeout=180s

              echo ""
              echo "Waiting for worker rollback"

              sudo kubectl -n ems rollout status deployment/ems-worker \
                --timeout=180s

              echo ""
              echo "=========================================="
              echo "ROLLBACK VERIFICATION"
              echo "=========================================="

              sudo kubectl -n ems get deployment \
                ems-backend ems-frontend ems-worker \
                -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"

              echo ""
              echo "Automatic rollback completed"

              exit 1
            }

            trap rollback ERR


            echo ""
            echo "=========================================="
            echo "REMOVING ANY EXISTING HPA"
            echo "=========================================="

            sudo kubectl -n ems delete hpa \
              ems-backend-hpa \
              ems-frontend-hpa \
              --ignore-not-found=true

            if sudo kubectl -n ems get hpa --no-headers 2>/dev/null | grep -q .; then
              echo "Removing remaining HPA resources"
              sudo kubectl -n ems delete hpa --all
            else
              echo "No HPA resources found"
            fi


            echo ""
            echo "=========================================="
            echo "APPLYING KUBERNETES MANIFESTS"
            echo "=========================================="

            sudo kubectl apply -f k8s/backend.yaml
            sudo kubectl apply -f k8s/frontend.yaml
            sudo kubectl apply -f k8s/worker.yaml

            echo ""
            echo "HPA is NOT applied."
            echo "EMS will run with exactly 1 replica per deployment."


            echo ""
            echo "=========================================="
            echo "DEPLOYING BACKEND"
            echo "=========================================="

            sudo kubectl -n ems set image deployment/ems-backend \
              backend=ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}


            echo ""
            echo "=========================================="
            echo "DEPLOYING FRONTEND"
            echo "=========================================="

            sudo kubectl -n ems set image deployment/ems-frontend \
              frontend=ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}


            echo ""
            echo "=========================================="
            echo "DEPLOYING WORKER"
            echo "=========================================="

            sudo kubectl -n ems set image deployment/ems-worker \
              worker=ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}


            echo ""
            echo "=========================================="
            echo "FORCING SINGLE REPLICA"
            echo "=========================================="

            sudo kubectl -n ems scale deployment/ems-backend --replicas=1
            sudo kubectl -n ems scale deployment/ems-frontend --replicas=1
            sudo kubectl -n ems scale deployment/ems-worker --replicas=1


            echo ""
            echo "=========================================="
            echo "WAITING FOR BACKEND ROLLOUT"
            echo "=========================================="

            sudo kubectl -n ems rollout status deployment/ems-backend \
              --timeout=180s


            echo ""
            echo "=========================================="
            echo "WAITING FOR FRONTEND ROLLOUT"
            echo "=========================================="

            sudo kubectl -n ems rollout status deployment/ems-frontend \
              --timeout=180s


            echo ""
            echo "=========================================="
            echo "WAITING FOR WORKER ROLLOUT"
            echo "=========================================="

            sudo kubectl -n ems rollout status deployment/ems-worker \
              --timeout=180s


            echo ""
            echo "=========================================="
            echo "VERIFYING DEPLOYMENTS"
            echo "=========================================="

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"


            echo ""
            echo "=========================================="
            echo "VERIFYING REPLICAS"
            echo "=========================================="

            BACKEND_REPLICAS=$(sudo kubectl -n ems get deployment ems-backend \
              -o jsonpath='{.spec.replicas}')

            FRONTEND_REPLICAS=$(sudo kubectl -n ems get deployment ems-frontend \
              -o jsonpath='{.spec.replicas}')

            WORKER_REPLICAS=$(sudo kubectl -n ems get deployment ems-worker \
              -o jsonpath='{.spec.replicas}')

            echo "Backend replicas:  ${BACKEND_REPLICAS}"
            echo "Frontend replicas: ${FRONTEND_REPLICAS}"
            echo "Worker replicas:   ${WORKER_REPLICAS}"

            if [ "${BACKEND_REPLICAS}" != "1" ]; then
              echo "Backend replica verification failed"
              exit 1
            fi

            if [ "${FRONTEND_REPLICAS}" != "1" ]; then
              echo "Frontend replica verification failed"
              exit 1
            fi

            if [ "${WORKER_REPLICAS}" != "1" ]; then
              echo "Worker replica verification failed"
              exit 1
            fi

            echo "All deployments confirmed at 1 replica"


            echo ""
            echo "=========================================="
            echo "RUNNING PRODUCTION API SMOKE TEST"
            echo "=========================================="

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ems-api-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              https://api.ems.avgprimetech.com/)

            echo "API HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "Production API smoke test failed"
              cat /tmp/ems-api-response.txt || true
              exit 1
            fi


            echo ""
            echo "=========================================="
            echo "CHECKING API HEALTH ENDPOINT"
            echo "=========================================="

            HEALTH_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ems-health-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              https://api.ems.avgprimetech.com/health)

            echo "Health HTTP status: ${HEALTH_STATUS}"

            if [ "${HEALTH_STATUS}" != "200" ]; then
              echo "Production health check failed"
              cat /tmp/ems-health-response.txt || true
              exit 1
            fi

            echo "Production API checks passed"


            echo ""
            echo "=========================================="
            echo "VERIFYING DEPLOYED IMAGES"
            echo "=========================================="

            CURRENT_BACKEND_IMAGE=$(sudo kubectl -n ems get deployment ems-backend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            CURRENT_FRONTEND_IMAGE=$(sudo kubectl -n ems get deployment ems-frontend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            CURRENT_WORKER_IMAGE=$(sudo kubectl -n ems get deployment ems-worker \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Current backend image:  ${CURRENT_BACKEND_IMAGE}"
            echo "Current frontend image: ${CURRENT_FRONTEND_IMAGE}"
            echo "Current worker image:   ${CURRENT_WORKER_IMAGE}"

            EXPECTED_BACKEND="ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}"
            EXPECTED_FRONTEND="ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}"
            EXPECTED_WORKER="ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}"

            if [ "${CURRENT_BACKEND_IMAGE}" != "${EXPECTED_BACKEND}" ]; then
              echo "Backend image verification failed"
              exit 1
            fi

            if [ "${CURRENT_FRONTEND_IMAGE}" != "${EXPECTED_FRONTEND}" ]; then
              echo "Frontend image verification failed"
              exit 1
            fi

            if [ "${CURRENT_WORKER_IMAGE}" != "${EXPECTED_WORKER}" ]; then
              echo "Worker image verification failed"
              exit 1
            fi

            echo "All image checks passed"


            echo ""
            echo "=========================================="
            echo "VERIFYING HPA IS DISABLED"
            echo "=========================================="

            if sudo kubectl -n ems get hpa --no-headers 2>/dev/null | grep -q .; then
              echo "ERROR: HPA resources still exist"
              sudo kubectl -n ems get hpa
              exit 1
            else
              echo "No HPA resources found"
            fi


            echo ""
            echo "=========================================="
            echo "FINAL EMS DEPLOYMENT STATUS"
            echo "=========================================="

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"

            echo ""
            echo "Pods:"

            sudo kubectl -n ems get pods -o wide

            echo ""
            echo "=========================================="
            echo "EMS DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="

            echo "Deployed commit: ${IMAGE_TAG}"
            echo "Backend replicas: 1"
            echo "Frontend replicas: 1"
            echo "Worker replicas: 1"
            echo "HPA: Disabled"


  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: ${{ always() && needs.build.result == 'success' && needs.deploy.result == 'success' }}

    steps:
      - name: Send Success Email using Microsoft Graph
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL: ${{ secrets.MS_SENDER_EMAIL }}
          MAIL_TO: "Sanjayvanan03@gmail.com,devops@avgprimetech.com"
          MAIL_CC: ""
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHED_BY: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          NAMESPACE: ems
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          echo "Obtaining Microsoft Graph access token..."

          TOKEN_RESPONSE=$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${MS_CLIENT_ID}" \
            --data-urlencode "client_secret=${MS_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Microsoft Graph access token generation failed"
            echo "$TOKEN_RESPONSE" | jq 'del(.access_token)' || true
            exit 1
          fi

          TO_JSON=$(jq -Rn --arg emails "$MAIL_TO" \
            '$emails | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | map({emailAddress:{address:.}})')
          CC_JSON=$(jq -Rn --arg emails "${MAIL_CC:-}" \
            '$emails | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | map({emailAddress:{address:.}})')

          HTML_BODY=$(cat <<EOF
          <!DOCTYPE html>
          <html>
          <body style="font-family:Arial,sans-serif;color:#333;">
            <div style="max-width:700px;margin:auto;border:1px solid #ddd;padding:25px;">
              <h2 style="color:#198754;">EMS Kubernetes Deployment Successful</h2>
              <p>Docker image build, Kubernetes deployment, rollout checks and backend health checks completed successfully.</p>
              <table style="width:100%;border-collapse:collapse;" border="1" cellpadding="10">
                <tr><td><b>Repository</b></td><td>${REPOSITORY}</td></tr>
                <tr><td><b>Branch</b></td><td>${BRANCH}</td></tr>
                <tr><td><b>Pushed By</b></td><td>${PUSHED_BY}</td></tr>
                <tr><td><b>Commit Author</b></td><td>${COMMIT_AUTHOR}</td></tr>
                <tr><td><b>Image Tag / Commit SHA</b></td><td>${COMMIT_SHA}</td></tr>
                <tr><td><b>Docker Build Result</b></td><td>${BUILD_RESULT}</td></tr>
                <tr><td><b>Deployment Job Result</b></td><td>${DEPLOY_RESULT}</td></tr>
                <tr><td><b>Namespace</b></td><td>${NAMESPACE}</td></tr>
                <tr><td><b>Status</b></td><td style="color:#198754;"><b>SUCCESS</b></td></tr>
              </table>
              <p style="margin-top:25px;"><a href="${RUN_URL}">View Docker Build Run</a></p>
              <p><a href="${RUN_URL}">View Deployment Workflow Run</a></p>
              <h2 style="color:#198754;">EMS Deployment SUCCESSFUL</h2>
            </div>
          </body>
          </html>
          EOF
          )

          MAIL_PAYLOAD=$(jq -n \
            --arg subject "EMS Kubernetes Deployment Successful" \
            --arg html "$HTML_BODY" \
            --argjson to "$TO_JSON" \
            --argjson cc "$CC_JSON" \
            '{message:{subject:$subject,body:{contentType:"HTML",content:$html},toRecipients:$to,ccRecipients:$cc},saveToSentItems:true}')

          HTTP_STATUS=$(curl -sS -o /tmp/ems-graph-response.txt \
            -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MS_SENDER_EMAIL}/sendMail" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$MAIL_PAYLOAD")

          if [ "$HTTP_STATUS" != "202" ]; then
            echo "Microsoft Graph email failed: HTTP ${HTTP_STATUS}"
            cat /tmp/ems-graph-response.txt
            exit 1
          fi
          echo "SUCCESS email accepted by Microsoft Graph"

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}

    steps:
      - name: Send Failure Email using Microsoft Graph
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL: ${{ secrets.MS_SENDER_EMAIL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHED_BY: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          NAMESPACE: ems
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          echo "Obtaining Microsoft Graph access token..."

          TOKEN_RESPONSE=$(curl -fsS -X POST \
            "https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${MS_CLIENT_ID}" \
            --data-urlencode "client_secret=${MS_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Microsoft Graph access token generation failed"
            echo "$TOKEN_RESPONSE" | jq 'del(.access_token)' || true
            exit 1
          fi

          TO_JSON=$(jq -Rn --arg emails "$MAIL_TO" \
            '$emails | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | map({emailAddress:{address:.}})')
          CC_JSON=$(jq -Rn --arg emails "${MAIL_CC:-}" \
            '$emails | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | map({emailAddress:{address:.}})')

          HTML_BODY=$(cat <<EOF
          <!DOCTYPE html>
          <html>
          <body style="font-family:Arial,sans-serif;color:#333;">
            <div style="max-width:700px;margin:auto;border:1px solid #ddd;padding:25px;">
              <h2 style="color:#dc3545;">EMS Kubernetes Deployment Failed</h2>
              <p>The Docker build or Kubernetes deployment failed. Please inspect the workflow logs for details.</p>
              <table style="width:100%;border-collapse:collapse;" border="1" cellpadding="10">
                <tr><td><b>Repository</b></td><td>${REPOSITORY}</td></tr>
                <tr><td><b>Branch</b></td><td>${BRANCH}</td></tr>
                <tr><td><b>Pushed By</b></td><td>${PUSHED_BY}</td></tr>
                <tr><td><b>Commit Author</b></td><td>${COMMIT_AUTHOR}</td></tr>
                <tr><td><b>Commit SHA</b></td><td>${COMMIT_SHA}</td></tr>
                <tr><td><b>Docker Build Result</b></td><td>${BUILD_RESULT}</td></tr>
                <tr><td><b>Deployment Job Result</b></td><td>${DEPLOY_RESULT}</td></tr>
                <tr><td><b>Namespace</b></td><td>${NAMESPACE}</td></tr>
                <tr><td><b>Status</b></td><td style="color:#dc3545;"><b>FAILED</b></td></tr>
                <tr><td><b>Action</b></td><td>Automatic rollback attempted if deployment failed</td></tr>
              </table>
              <p style="margin-top:25px;"><a href="${RUN_URL}">View Docker Build Run</a></p>
              <p><a href="${RUN_URL}">View Deployment Workflow Run</a></p>
              <h2 style="color:#dc3545;">EMS Deployment FAILED</h2>
            </div>
          </body>
          </html>
          EOF
          )

          MAIL_PAYLOAD=$(jq -n \
            --arg subject "FAILED: EMS Kubernetes Deployment" \
            --arg html "$HTML_BODY" \
            --argjson to "$TO_JSON" \
            --argjson cc "$CC_JSON" \
            '{message:{subject:$subject,body:{contentType:"HTML",content:$html},toRecipients:$to,ccRecipients:$cc},saveToSentItems:true}')

          HTTP_STATUS=$(curl -sS -o /tmp/ems-graph-response.txt \
            -w "%{http_code}" \
            -X POST "https://graph.microsoft.com/v1.0/users/${MS_SENDER_EMAIL}/sendMail" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$MAIL_PAYLOAD")

          if [ "$HTTP_STATUS" != "202" ]; then
            echo "Microsoft Graph email failed: HTTP ${HTTP_STATUS}"
            cat /tmp/ems-graph-response.txt
            exit 1
          fi
          echo "FAILURE email accepted by Microsoft Graph"
