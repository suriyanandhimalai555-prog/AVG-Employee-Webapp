name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# Prevent two production deployments from running at the same time.
# If a new commit is pushed while an older deployment is running,
# the older workflow is cancelled.
concurrency:
  group: ems-production
  cancel-in-progress: true

jobs:

  ############################################################
  # BUILD ALL EMS IMAGES
  ############################################################

  build:
    name: Build EMS Images
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # DOCKER BUILDX
      ########################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ########################################################
      # LOGIN TO GHCR
      ########################################################

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      ########################################################
      # BUILD AND PUSH IMAGE
      ########################################################

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          # GitHub runner is already ARM64.
          # No QEMU/emulation is required.
          platforms: linux/arm64

          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          ####################################################
          # FRONTEND API URL
          ####################################################

          build-args: |
            VITE_API_URL=https://api.ems.avgprimetech.com

          ####################################################
          # GITHUB ACTIONS CACHE
          ####################################################

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

          ####################################################
          # DISABLE EXTRA ATTESTATIONS
          ####################################################

          provenance: false
          sbom: false

  ############################################################
  # DEPLOY TO AWS ARM64 SERVER
  ############################################################

  deploy:
    name: Deploy EMS to AWS
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy EMS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 10m

          script: |

            set -e

            ##################################################
            # GO TO EMS DIRECTORY
            ##################################################

            cd /home/ubuntu/otp/apps/AVG-Employee-Webapp

            echo "========================================"
            echo "EMS DEPLOYMENT"
            echo "========================================"

            echo "Server architecture:"
            uname -m

            echo "Docker architecture:"
            docker info --format '{{.Architecture}}'

            ##################################################
            # DEPLOY EXACT COMMIT
            ##################################################

            export IMAGE_TAG="${{ github.sha }}"

            echo "========================================"
            echo "DEPLOYMENT COMMIT"
            echo "========================================"

            echo "IMAGE_TAG=$IMAGE_TAG"

            ##################################################
            # LOGIN TO GHCR
            ##################################################

            echo "========================================"
            echo "LOGIN GHCR"
            echo "========================================"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            ##################################################
            # SHOW IMAGES THAT WILL BE DEPLOYED
            ##################################################

            echo "========================================"
            echo "EMS IMAGES"
            echo "========================================"

            docker compose config | grep 'image:'

            ##################################################
            # PULL EXACT COMMIT IMAGES
            ##################################################

            echo "========================================"
            echo "PULLING EMS IMAGES"
            echo "========================================"

            docker compose pull

            ##################################################
            # START EMS
            ##################################################

            echo "========================================"
            echo "STARTING EMS"
            echo "========================================"

            docker compose up -d --remove-orphans

            ##################################################
            # WAIT FOR BACKEND
            ##################################################

            echo "========================================"
            echo "WAITING FOR BACKEND"
            echo "========================================"

            for i in $(seq 1 30); do

              if curl -fsS \
                --connect-timeout 2 \
                http://127.0.0.1:4040/health \
                > /tmp/ems-health.json; then

                echo "Backend is READY"

                cat /tmp/ems-health.json

                break

              fi

              echo "Backend not ready - attempt $i/30"

              if [ "$i" -eq 30 ]; then

                echo "Backend health check FAILED"

                echo "========== COMPOSE STATUS =========="

                docker compose ps

                echo "========== BACKEND LOGS =========="

                docker logs --tail 100 ems-backend || true

                exit 1

              fi

              sleep 1

            done

            ##################################################
            # WAIT FOR FRONTEND
            ##################################################

            echo "========================================"
            echo "WAITING FOR FRONTEND"
            echo "========================================"

            for i in $(seq 1 30); do

              if curl -fsS \
                --connect-timeout 2 \
                http://127.0.0.1:3020/ \
                > /dev/null; then

                echo "Frontend is READY"

                break

              fi

              echo "Frontend not ready - attempt $i/30"

              if [ "$i" -eq 30 ]; then

                echo "Frontend health check FAILED"

                echo "========== COMPOSE STATUS =========="

                docker compose ps

                echo "========== FRONTEND LOGS =========="

                docker logs --tail 100 ems-frontend || true

                exit 1

              fi

              sleep 1

            done

            ##################################################
            # CHECK WORKER
            ##################################################

            echo "========================================"
            echo "CHECKING WORKER"
            echo "========================================"

            if docker inspect ems-worker \
              --format '{{.State.Status}}' | grep -q '^running$'; then

              echo "Worker is RUNNING"

            else

              echo "Worker FAILED"

              echo "========== WORKER LOGS =========="

              docker logs --tail 100 ems-worker || true

              exit 1

            fi

            ##################################################
            # VERIFY DEPLOYED IMAGE TAGS
            ##################################################

            echo "========================================"
            echo "VERIFYING DEPLOYED IMAGES"
            echo "========================================"

            echo "Backend image:"
            docker inspect ems-backend \
              --format '{{.Config.Image}}'

            echo "Frontend image:"
            docker inspect ems-frontend \
              --format '{{.Config.Image}}'

            echo "Worker image:"
            docker inspect ems-worker \
              --format '{{.Config.Image}}'

            ##################################################
            # FINAL STATUS
            ##################################################

            echo "========================================"
            echo "FINAL EMS STATUS"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "EMS DEPLOYMENT SUCCESSFUL"
            echo "========================================"

            echo "Deployed commit:"
            echo "$IMAGE_TAG"

  ############################################################
  # SUCCESS EMAIL
  ############################################################

  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: success()

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "✅ EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Successful</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>

            </table>

  ############################################################
  # FAILURE EMAIL
  ############################################################

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: failure()

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "❌ EMS Deployment Failed"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Failed</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>

            </table>
