name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Docker Buildx + QEMU
      ####################################################

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ####################################################
      # Login to GHCR
      ####################################################

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      ####################################################
      # Backend
      ####################################################

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:${{ github.sha }}

      ####################################################
      # Frontend
      ####################################################

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-frontend:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-frontend:${{ github.sha }}

      ####################################################
      # Worker
      ####################################################

      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-worker:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-worker:${{ github.sha }}

      ####################################################
      # Deploy to AWS VPS
      ####################################################

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            cd /root/otp/apps/AVG-Employee-Webapp

            echo "========================================"
            echo "EMS DEPLOYMENT"
            echo "========================================"

            echo "Server architecture:"
            uname -m

            echo "Docker architecture:"
            docker info --format '{{.Architecture}}'

            echo "========================================"
            echo "Login to GHCR"
            echo "========================================"

            docker login ghcr.io \
              -u ${{ secrets.GHCR_USERNAME }} \
              -p ${{ secrets.GHCR_TOKEN }}

            echo "========================================"
            echo "Pulling multi-architecture images"
            echo "========================================"

            docker compose pull

            echo "========================================"
            echo "Stopping EMS"
            echo "========================================"

            docker compose down

            echo "========================================"
            echo "Starting EMS"
            echo "========================================"

            docker compose up -d --force-recreate

            echo "========================================"
            echo "Waiting for containers"
            echo "========================================"

            sleep 10

            docker compose ps

            echo "========================================"
            echo "Checking Backend Container"
            echo "========================================"

            if ! docker inspect ems-backend \
              --format '{{.State.Status}}' | grep -q running; then

              echo "Backend container is NOT running"

              docker logs --tail 100 ems-backend || true

              exit 1
            fi

            echo "Backend container is running"

            echo "========================================"
            echo "Checking Backend Architecture"
            echo "========================================"

            docker image inspect \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:latest \
              --format '{{.Architecture}}/{{.Os}}'

            echo "========================================"
            echo "Backend Health Check"
            echo "========================================"

            for i in $(seq 1 12); do

              if curl -fsS http://127.0.0.1:4040/health > /tmp/ems-health.json; then

                echo "Backend health check SUCCESS"

                cat /tmp/ems-health.json

                break
              fi

              echo "Backend not ready..."
              echo "Attempt $i/12"

              sleep 5

              if [ "$i" -eq 12 ]; then

                echo "Backend health check FAILED"

                docker compose ps

                echo "========== BACKEND LOGS =========="

                docker logs --tail 150 ems-backend || true

                exit 1
              fi

            done

            echo "========================================"
            echo "Frontend Health Check"
            echo "========================================"

            for i in $(seq 1 12); do

              if curl -fsS http://127.0.0.1:3020/ > /dev/null; then

                echo "Frontend health check SUCCESS"

                break
              fi

              echo "Frontend not ready..."
              echo "Attempt $i/12"

              sleep 5

              if [ "$i" -eq 12 ]; then

                echo "Frontend health check FAILED"

                docker compose ps

                echo "========== FRONTEND LOGS =========="

                docker logs --tail 150 ems-frontend || true

                exit 1
              fi

            done

            echo "========================================"
            echo "Worker Check"
            echo "========================================"

            if ! docker inspect ems-worker \
              --format '{{.State.Status}}' | grep -q running; then

              echo "Worker is NOT running"

              docker logs --tail 100 ems-worker || true

              exit 1
            fi

            echo "Worker is running"

            echo "========================================"
            echo "Final EMS Status"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "EMS DEPLOYMENT SUCCESSFUL"
            echo "========================================"

      ####################################################
      # Success Email
      ####################################################

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "✅ EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>✅ EMS Deployment Successful</h2>

            <p>The EMS application has been successfully deployed.</p>

            <table border="1" cellpadding="8" cellspacing="0">
              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Docker / AWS VPS</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>linux/amd64 + linux/arm64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>
            </table>

            <br>

            <p>
              Backend, Frontend and Worker containers passed their health checks.
            </p>

      ####################################################
      # Failure Email
      ####################################################

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "❌ EMS Deployment Failed"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>❌ EMS Deployment Failed</h2>

            <p>
              The EMS deployment failed during the GitHub Actions deployment process.
            </p>

            <table border="1" cellpadding="8" cellspacing="0">
              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Docker / AWS VPS</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>
            </table>

            <br>

            <p>
              Please check the GitHub Actions workflow logs for the exact failure reason.
            </p>
