name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Backend
        run: |
          docker build \
          -f Dockerfile.backend \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:latest .

      - name: Push Backend
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:latest

      - name: Build Frontend
        run: |
          docker build \
          -f Dockerfile.frontend \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-frontend:latest .

      - name: Push Frontend
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-frontend:latest

      - name: Build Worker
        run: |
          docker build \
          -f Dockerfile.worker \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-worker:latest .

      - name: Push Worker
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-worker:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /root/otp/apps/AVG-Employee-Webapp

            docker login ghcr.io \
            -u ${{ secrets.GHCR_USERNAME }} \
            -p ${{ secrets.GHCR_TOKEN }}

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -af
