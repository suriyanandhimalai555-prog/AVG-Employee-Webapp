name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ems-production
  cancel-in-progress: false

jobs:

  build:
    name: Build EMS Images
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          build-args: |
            VITE_API_URL=https://ems.avgprimetech.com/api

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

          provenance: false
          sbom: false


  deploy:
    name: Deploy EMS to Kubernetes
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy EMS to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            cd /home/ubuntu/otp/apps/AVG-Employee-Webapp

            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_USER="${{ secrets.GHCR_USERNAME }}"

            echo "=========================================="
            echo "EMS DEPLOYMENT STARTED"
            echo "=========================================="
            echo "Architecture: $(uname -m)"
            echo "Commit: ${IMAGE_TAG}"

            echo ""
            echo "Reading currently running images"

            OLD_BACKEND_IMAGE=$(sudo kubectl -n ems get deployment ems-backend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            OLD_FRONTEND_IMAGE=$(sudo kubectl -n ems get deployment ems-frontend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            OLD_WORKER_IMAGE=$(sudo kubectl -n ems get deployment ems-worker \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Old backend image:  ${OLD_BACKEND_IMAGE}"
            echo "Old frontend image: ${OLD_FRONTEND_IMAGE}"
            echo "Old worker image:   ${OLD_WORKER_IMAGE}"

            echo ""
            echo "=========================================="
            echo "CURRENT DEPLOYMENT STATUS"
            echo "=========================================="

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"


            rollback() {
              echo ""
              echo "=========================================="
              echo "DEPLOYMENT FAILED"
              echo "STARTING AUTOMATIC ROLLBACK"
              echo "=========================================="

              set +e

              echo ""
              echo "Restoring backend image"

              sudo kubectl -n ems set image deployment/ems-backend \
                backend="${OLD_BACKEND_IMAGE}"

              echo ""
              echo "Restoring frontend image"

              sudo kubectl -n ems set image deployment/ems-frontend \
                frontend="${OLD_FRONTEND_IMAGE}"

              echo ""
              echo "Restoring worker image"

              sudo kubectl -n ems set image deployment/ems-worker \
                worker="${OLD_WORKER_IMAGE}"

              echo ""
              echo "Forcing replicas to 1"

              sudo kubectl -n ems scale deployment/ems-backend --replicas=1
              sudo kubectl -n ems scale deployment/ems-frontend --replicas=1
              sudo kubectl -n ems scale deployment/ems-worker --replicas=1

              echo ""
              echo "Waiting for backend rollback"

              sudo kubectl -n ems rollout status deployment/ems-backend \
                --timeout=180s

              echo ""
              echo "Waiting for frontend rollback"

              sudo kubectl -n ems rollout status deployment/ems-frontend \
                --timeout=180s

              echo ""
              echo "Waiting for worker rollback"

              sudo kubectl -n ems rollout status deployment/ems-worker \
                --timeout=180s

              echo ""
              echo "=========================================="
              echo "ROLLBACK VERIFICATION"
              echo "=========================================="

              sudo kubectl -n ems get deployment \
                ems-backend ems-frontend ems-worker \
                -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"

              echo ""
              echo "Automatic rollback completed"

              exit 1
            }

            trap rollback ERR


            echo ""
            echo "=========================================="
            echo "REMOVING ANY EXISTING HPA"
            echo "=========================================="

            sudo kubectl -n ems delete hpa \
              ems-backend-hpa \
              ems-frontend-hpa \
              --ignore-not-found=true

            if sudo kubectl -n ems get hpa --no-headers 2>/dev/null | grep -q .; then
              echo "Removing remaining HPA resources"
              sudo kubectl -n ems delete hpa --all
            else
              echo "No HPA resources found"
            fi


            echo ""
            echo "=========================================="
            echo "APPLYING KUBERNETES MANIFESTS"
            echo "=========================================="

            sudo kubectl apply -f k8s/backend.yaml
            sudo kubectl apply -f k8s/frontend.yaml
            sudo kubectl apply -f k8s/worker.yaml

            echo ""
            echo "HPA is NOT applied."
            echo "EMS will run with exactly 1 replica per deployment."


            echo ""
            echo "=========================================="
            echo "DEPLOYING BACKEND"
            echo "=========================================="

            sudo kubectl -n ems set image deployment/ems-backend \
              backend=ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}


            echo ""
            echo "=========================================="
            echo "DEPLOYING FRONTEND"
            echo "=========================================="

            sudo kubectl -n ems set image deployment/ems-frontend \
              frontend=ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}


            echo ""
            echo "=========================================="
            echo "DEPLOYING WORKER"
            echo "=========================================="

            sudo kubectl -n ems set image deployment/ems-worker \
              worker=ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}


            echo ""
            echo "=========================================="
            echo "FORCING SINGLE REPLICA"
            echo "=========================================="

            sudo kubectl -n ems scale deployment/ems-backend --replicas=1
            sudo kubectl -n ems scale deployment/ems-frontend --replicas=1
            sudo kubectl -n ems scale deployment/ems-worker --replicas=1


            echo ""
            echo "=========================================="
            echo "WAITING FOR BACKEND ROLLOUT"
            echo "=========================================="

            sudo kubectl -n ems rollout status deployment/ems-backend \
              --timeout=180s


            echo ""
            echo "=========================================="
            echo "WAITING FOR FRONTEND ROLLOUT"
            echo "=========================================="

            sudo kubectl -n ems rollout status deployment/ems-frontend \
              --timeout=180s


            echo ""
            echo "=========================================="
            echo "WAITING FOR WORKER ROLLOUT"
            echo "=========================================="

            sudo kubectl -n ems rollout status deployment/ems-worker \
              --timeout=180s


            echo ""
            echo "=========================================="
            echo "VERIFYING DEPLOYMENTS"
            echo "=========================================="

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"


            echo ""
            echo "=========================================="
            echo "VERIFYING REPLICAS"
            echo "=========================================="

            BACKEND_REPLICAS=$(sudo kubectl -n ems get deployment ems-backend \
              -o jsonpath='{.spec.replicas}')

            FRONTEND_REPLICAS=$(sudo kubectl -n ems get deployment ems-frontend \
              -o jsonpath='{.spec.replicas}')

            WORKER_REPLICAS=$(sudo kubectl -n ems get deployment ems-worker \
              -o jsonpath='{.spec.replicas}')

            echo "Backend replicas:  ${BACKEND_REPLICAS}"
            echo "Frontend replicas: ${FRONTEND_REPLICAS}"
            echo "Worker replicas:   ${WORKER_REPLICAS}"

            if [ "${BACKEND_REPLICAS}" != "1" ]; then
              echo "Backend replica verification failed"
              exit 1
            fi

            if [ "${FRONTEND_REPLICAS}" != "1" ]; then
              echo "Frontend replica verification failed"
              exit 1
            fi

            if [ "${WORKER_REPLICAS}" != "1" ]; then
              echo "Worker replica verification failed"
              exit 1
            fi

            echo "All deployments confirmed at 1 replica"


            echo ""
            echo "=========================================="
            echo "RUNNING PRODUCTION API SMOKE TEST"
            echo "=========================================="

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ems-api-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              https://api.ems.avgprimetech.com/)

            echo "API HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "Production API smoke test failed"
              cat /tmp/ems-api-response.txt || true
              exit 1
            fi


            echo ""
            echo "=========================================="
            echo "CHECKING API HEALTH ENDPOINT"
            echo "=========================================="

            HEALTH_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ems-health-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              https://api.ems.avgprimetech.com/health)

            echo "Health HTTP status: ${HEALTH_STATUS}"

            if [ "${HEALTH_STATUS}" != "200" ]; then
              echo "Production health check failed"
              cat /tmp/ems-health-response.txt || true
              exit 1
            fi

            echo "Production API checks passed"


            echo ""
            echo "=========================================="
            echo "VERIFYING DEPLOYED IMAGES"
            echo "=========================================="

            CURRENT_BACKEND_IMAGE=$(sudo kubectl -n ems get deployment ems-backend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            CURRENT_FRONTEND_IMAGE=$(sudo kubectl -n ems get deployment ems-frontend \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            CURRENT_WORKER_IMAGE=$(sudo kubectl -n ems get deployment ems-worker \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Current backend image:  ${CURRENT_BACKEND_IMAGE}"
            echo "Current frontend image: ${CURRENT_FRONTEND_IMAGE}"
            echo "Current worker image:   ${CURRENT_WORKER_IMAGE}"

            EXPECTED_BACKEND="ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}"
            EXPECTED_FRONTEND="ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}"
            EXPECTED_WORKER="ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}"

            if [ "${CURRENT_BACKEND_IMAGE}" != "${EXPECTED_BACKEND}" ]; then
              echo "Backend image verification failed"
              exit 1
            fi

            if [ "${CURRENT_FRONTEND_IMAGE}" != "${EXPECTED_FRONTEND}" ]; then
              echo "Frontend image verification failed"
              exit 1
            fi

            if [ "${CURRENT_WORKER_IMAGE}" != "${EXPECTED_WORKER}" ]; then
              echo "Worker image verification failed"
              exit 1
            fi

            echo "All image checks passed"


            echo ""
            echo "=========================================="
            echo "VERIFYING HPA IS DISABLED"
            echo "=========================================="

            if sudo kubectl -n ems get hpa --no-headers 2>/dev/null | grep -q .; then
              echo "ERROR: HPA resources still exist"
              sudo kubectl -n ems get hpa
              exit 1
            else
              echo "No HPA resources found"
            fi


            echo ""
            echo "=========================================="
            echo "FINAL EMS DEPLOYMENT STATUS"
            echo "=========================================="

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,REPLICAS:.spec.replicas,READY:.status.readyReplicas"

            echo ""
            echo "Pods:"

            sudo kubectl -n ems get pods -o wide

            echo ""
            echo "=========================================="
            echo "EMS DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="

            echo "Deployed commit: ${IMAGE_TAG}"
            echo "Backend replicas: 1"
            echo "Frontend replicas: 1"
            echo "Worker replicas: 1"
            echo "HPA: Disabled"


  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: success()

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com,
            devops@avgprimetech.com

          html_body: |
            <h2>EMS Deployment Successful</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Backend Replicas</b></td>
                <td>1</td>
              </tr>

              <tr>
                <td><b>Frontend Replicas</b></td>
                <td>1</td>
              </tr>

              <tr>
                <td><b>Worker Replicas</b></td>
                <td>1</td>
              </tr>

              <tr>
                <td><b>HPA</b></td>
                <td>Disabled</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>

              <tr>
                <td><b>Rollback</b></td>
                <td>Not required</td>
              </tr>

            </table>


  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: failure()

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "EMS Deployment Failed - Automatic Rollback"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Failed</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Backend Replicas</b></td>
                <td>1</td>
              </tr>

              <tr>
                <td><b>Frontend Replicas</b></td>
                <td>1</td>
              </tr>

              <tr>
                <td><b>Worker Replicas</b></td>
                <td>1</td>
              </tr>

              <tr>
                <td><b>HPA</b></td>
                <td>Disabled</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>

              <tr>
                <td><b>Action</b></td>
                <td>Automatic rollback initiated</td>
              </tr>

            </table>
