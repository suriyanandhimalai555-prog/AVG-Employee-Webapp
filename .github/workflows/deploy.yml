name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  ############################################################
  # BACKEND
  ############################################################

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:${{ github.sha }}
          cache-from: type=gha,scope=ems-backend
          cache-to: type=gha,mode=max,scope=ems-backend


  ############################################################
  # FRONTEND
  ############################################################

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-frontend:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-frontend:${{ github.sha }}
          cache-from: type=gha,scope=ems-frontend
          cache-to: type=gha,mode=max,scope=ems-frontend


  ############################################################
  # WORKER
  ############################################################

  build-worker:
    name: Build Worker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-worker:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-worker:${{ github.sha }}
          cache-from: type=gha,scope=ems-worker
          cache-to: type=gha,mode=max,scope=ems-worker


  ############################################################
  # DEPLOY
  ############################################################

  deploy:
    name: Deploy EMS to AWS
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend
      - build-worker

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |

            set -e

            cd /root/otp/apps/AVG-Employee-Webapp

            echo "========================================"
            echo "EMS DEPLOYMENT"
            echo "========================================"

            echo "Server architecture:"
            uname -m

            echo "Docker architecture:"
            docker info --format '{{.Architecture}}'

            echo "========================================"
            echo "LOGIN TO GHCR"
            echo "========================================"

            docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              -p "${{ secrets.GHCR_TOKEN }}"

            echo "========================================"
            echo "PULLING ARM64 IMAGES"
            echo "========================================"

            docker compose pull

            echo "========================================"
            echo "STOPPING CURRENT EMS"
            echo "========================================"

            docker compose down

            echo "========================================"
            echo "STARTING NEW EMS"
            echo "========================================"

            docker compose up -d --force-recreate

            echo "========================================"
            echo "WAITING FOR CONTAINERS"
            echo "========================================"

            sleep 5

            docker compose ps

            echo "========================================"
            echo "BACKEND STATUS"
            echo "========================================"

            if ! docker inspect ems-backend \
              --format '{{.State.Status}}' | grep -q running; then

              echo "Backend container FAILED"

              docker logs --tail 150 ems-backend || true

              exit 1

            fi

            echo "Backend container RUNNING"

            echo "========================================"
            echo "BACKEND ARCHITECTURE"
            echo "========================================"

            docker inspect ems-backend \
              --format 'Container={{.Name}} Image={{.Config.Image}}'

            docker image inspect \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/ems-backend:latest \
              --format 'Image={{.Architecture}}/{{.Os}}'

            echo "========================================"
            echo "BACKEND HEALTH CHECK"
            echo "========================================"

            for i in $(seq 1 12); do

              if curl -fsS http://127.0.0.1:4040/health > /tmp/ems-health.json; then

                echo "Backend health check SUCCESS"

                cat /tmp/ems-health.json

                break

              fi

              echo "Backend not ready"
              echo "Attempt $i/12"

              sleep 5

              if [ "$i" -eq 12 ]; then

                echo "Backend health check FAILED"

                docker compose ps

                echo "========== BACKEND LOGS =========="

                docker logs --tail 150 ems-backend || true

                exit 1

              fi

            done

            echo "========================================"
            echo "FRONTEND HEALTH CHECK"
            echo "========================================"

            for i in $(seq 1 12); do

              if curl -fsS http://127.0.0.1:3020/ > /dev/null; then

                echo "Frontend health check SUCCESS"

                break

              fi

              echo "Frontend not ready"
              echo "Attempt $i/12"

              sleep 3

              if [ "$i" -eq 12 ]; then

                echo "Frontend health check FAILED"

                docker compose ps

                echo "========== FRONTEND LOGS =========="

                docker logs --tail 150 ems-frontend || true

                exit 1

              fi

            done

            echo "========================================"
            echo "WORKER CHECK"
            echo "========================================"

            if ! docker inspect ems-worker \
              --format '{{.State.Status}}' | grep -q running; then

              echo "Worker FAILED"

              docker logs --tail 150 ems-worker || true

              exit 1

            fi

            echo "Worker RUNNING"

            echo "========================================"
            echo "FINAL STATUS"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "CLEANING UNUSED IMAGES"
            echo "========================================"

            docker image prune -af

            echo "========================================"
            echo "EMS DEPLOYMENT SUCCESSFUL"
            echo "========================================"


  ############################################################
  # SUCCESS EMAIL
  ############################################################

  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: success()

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "✅ EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Successful</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>

            </table>


  ############################################################
  # FAILURE EMAIL
  ############################################################

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend
      - build-worker
      - deploy

    if: failure()

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "❌ EMS Deployment Failed"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Failed</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>

            </table>
