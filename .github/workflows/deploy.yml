name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# Prevent multiple EMS deployments from running at the same time
concurrency:
  group: ems-production
  cancel-in-progress: true

jobs:

  ############################################################
  # BUILD ALL EMS IMAGES
  ############################################################

  build:
    name: Build EMS Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

  ############################################################
  # DEPLOY TO AWS ARM64
  ############################################################

  deploy:
    name: Deploy EMS to AWS
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy EMS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 10m

          script: |

            set -e

            cd /home/ubuntu/otp/apps/AVG-Employee-Webapp

            echo "========================================"
            echo "EMS DEPLOYMENT"
            echo "========================================"

            echo "Server architecture:"
            uname -m

            echo "Docker architecture:"
            docker info --format '{{.Architecture}}'

            echo "========================================"
            echo "LOGIN GHCR"
            echo "========================================"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "========================================"
            echo "PULLING LATEST EMS IMAGES"
            echo "========================================"

            docker compose pull

            echo "========================================"
            echo "STARTING EMS"
            echo "========================================"

            docker compose up -d --remove-orphans

            echo "========================================"
            echo "WAITING FOR BACKEND"
            echo "========================================"

            for i in $(seq 1 15); do

              if curl -fsS --connect-timeout 2 \
                http://127.0.0.1:4040/health \
                > /tmp/ems-health.json; then

                echo "Backend is READY"

                cat /tmp/ems-health.json

                break
              fi

              echo "Backend not ready - attempt $i/15"

              if [ "$i" -eq 15 ]; then

                echo "Backend health check FAILED"

                docker compose ps

                echo "========== BACKEND LOGS =========="

                docker logs --tail 100 ems-backend || true

                exit 1
              fi

              sleep 1

            done

            echo "========================================"
            echo "WAITING FOR FRONTEND"
            echo "========================================"

            for i in $(seq 1 15); do

              if curl -fsS --connect-timeout 2 \
                http://127.0.0.1:3020/ \
                > /dev/null; then

                echo "Frontend is READY"

                break
              fi

              echo "Frontend not ready - attempt $i/15"

              if [ "$i" -eq 15 ]; then

                echo "Frontend health check FAILED"

                docker compose ps

                echo "========== FRONTEND LOGS =========="

                docker logs --tail 100 ems-frontend || true

                exit 1
              fi

              sleep 1

            done

            echo "========================================"
            echo "CHECKING WORKER"
            echo "========================================"

            if docker inspect ems-worker \
              --format '{{.State.Status}}' | grep -q running; then

              echo "Worker is RUNNING"

            else

              echo "Worker FAILED"

              docker logs --tail 100 ems-worker || true

              exit 1

            fi

            echo "========================================"
            echo "FINAL EMS STATUS"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "EMS DEPLOYMENT SUCCESSFUL"
            echo "========================================"


  ############################################################
  # SUCCESS EMAIL
  ############################################################

  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: success()

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "✅ EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Successful</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>

            </table>


  ############################################################
  # FAILURE EMAIL
  ############################################################

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: failure()

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "❌ EMS Deployment Failed"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Failed</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>

            </table>
