name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# Prevent two production deployments from running at the same time.
# If a new commit is pushed while an older deployment is running,
# the older workflow is cancelled.
concurrency:
  group: ems-production
  cancel-in-progress: true

jobs:

  ############################################################
  # BUILD ALL EMS IMAGES
  ############################################################

  build:
    name: Build EMS Images
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # DOCKER BUILDX
      ########################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ########################################################
      # LOGIN TO GHCR
      ########################################################

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      ########################################################
      # BUILD AND PUSH IMAGE
      ########################################################

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}

          # GitHub runner is already ARM64.
          # No QEMU/emulation is required.
          platforms: linux/arm64

          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          ####################################################
          # FRONTEND API URL
          ####################################################

          build-args: |
            VITE_API_URL=https://api.ems.avgprimetech.com

          ####################################################
          # GITHUB ACTIONS CACHE
          ####################################################

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

          ####################################################
          # DISABLE EXTRA ATTESTATIONS
          ####################################################

          provenance: false
          sbom: false

  ############################################################
  # DEPLOY TO AWS ARM64 SERVER
  ############################################################

  deploy:
    name: Deploy EMS to Kubernetes
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy EMS to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            cd /home/ubuntu/otp/apps/AVG-Employee-Webapp

            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_USER="${{ secrets.GHCR_USERNAME }}"

            echo "========================================"
            echo "EMS KUBERNETES DEPLOYMENT"
            echo "========================================"
            echo "Architecture: $(uname -m)"
            echo "Commit: $IMAGE_TAG"

            echo "========================================"
            echo "APPLYING KUBERNETES MANIFESTS"
            echo "========================================"

            sudo kubectl apply -f k8s/backend.yaml
            sudo kubectl apply -f k8s/frontend.yaml
            sudo kubectl apply -f k8s/worker.yaml

            echo "========================================"
            echo "SETTING EXACT IMAGE TAGS"
            echo "========================================"

            sudo kubectl -n ems set image deployment/ems-backend \
              backend=ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}

            sudo kubectl -n ems set image deployment/ems-frontend \
              frontend=ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}

            sudo kubectl -n ems set image deployment/ems-worker \
              worker=ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}

            echo "========================================"
            echo "WAITING FOR ROLLOUT"
            echo "========================================"

            sudo kubectl -n ems rollout status deployment/ems-backend --timeout=180s
            sudo kubectl -n ems rollout status deployment/ems-frontend --timeout=180s
            sudo kubectl -n ems rollout status deployment/ems-worker --timeout=180s

            echo "========================================"
            echo "EMS POD STATUS"
            echo "========================================"

            sudo kubectl -n ems get pods -o wide

            echo "========================================"
            echo "DEPLOYED IMAGES"
            echo "========================================"

            sudo kubectl -n ems get deployment \
              ems-backend ems-frontend ems-worker \
              -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image"

            echo "========================================"
            echo "EMS KUBERNETES DEPLOYMENT SUCCESSFUL"
            echo "========================================"
            echo "Deployed commit: $IMAGE_TAG"
  ############################################################
  # SUCCESS EMAIL
  ############################################################

  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: success()

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "✅ EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Successful</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>

            </table>

  ############################################################
  # FAILURE EMAIL
  ############################################################

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: failure()

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "❌ EMS Deployment Failed"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Failed</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>

            </table>
