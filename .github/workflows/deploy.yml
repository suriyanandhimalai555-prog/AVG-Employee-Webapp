name: Deploy EMS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ems-production
  cancel-in-progress: false

jobs:

  build:
    name: Build EMS Images
    runs-on: ubuntu-24.04-arm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            image: ems-backend

          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ems-frontend

          - name: worker
            dockerfile: Dockerfile.worker
            image: ems-worker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

          build-args: |
            VITE_API_URL=https://ems.avgprimetech.com/api

          cache-from: type=gha,scope=ems-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ems-${{ matrix.name }}

          provenance: false
          sbom: false

  deploy:
    name: Deploy EMS to Kubernetes
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Deploy EMS to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 15m

          script: |
            set -Eeuo pipefail

            cd /home/ubuntu/otp/apps/AVG-Employee-Webapp

            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_USER="${{ secrets.GHCR_USERNAME }}"

            echo "EMS deployment started"
            echo "Architecture: $(uname -m)"
            echo "Commit: ${IMAGE_TAG}"

            echo "Reading currently running images"

            OLD_BACKEND_IMAGE=$(sudo kubectl -n ems get deployment ems-backend -o jsonpath='{.spec.template.spec.containers[0].image}')
            OLD_FRONTEND_IMAGE=$(sudo kubectl -n ems get deployment ems-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')
            OLD_WORKER_IMAGE=$(sudo kubectl -n ems get deployment ems-worker -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Old backend image: ${OLD_BACKEND_IMAGE}"
            echo "Old frontend image: ${OLD_FRONTEND_IMAGE}"
            echo "Old worker image: ${OLD_WORKER_IMAGE}"

            rollback() {
              echo ""
              echo "Deployment failed"
              echo "Starting automatic rollback"

              set +e

              echo "Rolling back backend"
              sudo kubectl -n ems rollout undo deployment/ems-backend

              echo "Rolling back frontend"
              sudo kubectl -n ems rollout undo deployment/ems-frontend

              echo "Rolling back worker"
              sudo kubectl -n ems rollout undo deployment/ems-worker

              echo "Waiting for backend rollback"
              sudo kubectl -n ems rollout status deployment/ems-backend --timeout=180s

              echo "Waiting for frontend rollback"
              sudo kubectl -n ems rollout status deployment/ems-frontend --timeout=180s

              echo "Waiting for worker rollback"
              sudo kubectl -n ems rollout status deployment/ems-worker --timeout=180s

              echo "Verifying rolled-back images"

              sudo kubectl -n ems get deployment \
                ems-backend ems-frontend ems-worker \
                -o custom-columns="NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image"

              echo "Automatic rollback completed"

              exit 1
            }

            trap rollback ERR

            echo "Applying Kubernetes manifests"

            sudo kubectl apply -f k8s/backend.yaml
            sudo kubectl apply -f k8s/frontend.yaml
            sudo kubectl apply -f k8s/worker.yaml
            sudo kubectl apply -f k8s/hpa.yaml

            echo "Deploying backend ${IMAGE_TAG}"

            sudo kubectl -n ems set image deployment/ems-backend \
              backend=ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}

            echo "Deploying frontend ${IMAGE_TAG}"

            sudo kubectl -n ems set image deployment/ems-frontend \
              frontend=ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}

            echo "Deploying worker ${IMAGE_TAG}"

            sudo kubectl -n ems set image deployment/ems-worker \
              worker=ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}

            echo "Waiting for backend rollout"

            sudo kubectl -n ems rollout status deployment/ems-backend \
              --timeout=180s

            echo "Waiting for frontend rollout"

            sudo kubectl -n ems rollout status deployment/ems-frontend \
              --timeout=180s

            echo "Waiting for worker rollout"

            sudo kubectl -n ems rollout status deployment/ems-worker \
              --timeout=180s

            echo "Checking pod readiness"

            sudo kubectl -n ems wait \
              --for=condition=ready pod \
              -l app=ems-backend \
              --timeout=120s

            sudo kubectl -n ems wait \
              --for=condition=ready pod \
              -l app=ems-frontend \
              --timeout=120s

            sudo kubectl -n ems wait \
              --for=condition=ready pod \
              -l app=ems-worker \
              --timeout=120s

            echo "Running production API smoke test"

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ems-api-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              https://api.ems.avgprimetech.com/)

            echo "API HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "Production API smoke test failed"
              cat /tmp/ems-api-response.txt || true
              exit 1
            fi

            echo "Checking API health endpoint"

            HEALTH_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/ems-health-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              https://api.ems.avgprimetech.com/health)

            echo "Health HTTP status: ${HEALTH_STATUS}"

            if [ "${HEALTH_STATUS}" != "200" ]; then
              echo "Production health check failed"
              cat /tmp/ems-health-response.txt || true
              exit 1
            fi

            echo "Production API checks passed"

            echo "Verifying deployed images"

            CURRENT_BACKEND_IMAGE=$(sudo kubectl -n ems get deployment ems-backend -o jsonpath='{.spec.template.spec.containers[0].image}')
            CURRENT_FRONTEND_IMAGE=$(sudo kubectl -n ems get deployment ems-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')
            CURRENT_WORKER_IMAGE=$(sudo kubectl -n ems get deployment ems-worker -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Current backend image: ${CURRENT_BACKEND_IMAGE}"
            echo "Current frontend image: ${CURRENT_FRONTEND_IMAGE}"
            echo "Current worker image: ${CURRENT_WORKER_IMAGE}"

            EXPECTED_BACKEND="ghcr.io/${GHCR_USER}/ems-backend:${IMAGE_TAG}"
            EXPECTED_FRONTEND="ghcr.io/${GHCR_USER}/ems-frontend:${IMAGE_TAG}"
            EXPECTED_WORKER="ghcr.io/${GHCR_USER}/ems-worker:${IMAGE_TAG}"

            if [ "${CURRENT_BACKEND_IMAGE}" != "${EXPECTED_BACKEND}" ]; then
              echo "Backend image verification failed"
              exit 1
            fi

            if [ "${CURRENT_FRONTEND_IMAGE}" != "${EXPECTED_FRONTEND}" ]; then
              echo "Frontend image verification failed"
              exit 1
            fi

            if [ "${CURRENT_WORKER_IMAGE}" != "${EXPECTED_WORKER}" ]; then
              echo "Worker image verification failed"
              exit 1
            fi

            echo "All image checks passed"

            echo "EMS deployment completed successfully"
            echo "Deployed commit: ${IMAGE_TAG}"

  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: success()

    steps:

      - name: Send Success Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "EMS Deployment Successful"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Successful</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>SUCCESS</td>
              </tr>

              <tr>
                <td><b>Rollback</b></td>
                <td>Not required</td>
              </tr>

            </table>

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest

    needs:
      - build
      - deploy

    if: failure()

    steps:

      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "EMS Deployment Failed - Automatic Rollback"

          from: ${{ secrets.SMTP_USERNAME }}

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>EMS Deployment Failed</h2>

            <table border="1" cellpadding="8">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Architecture</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>FAILED</td>
              </tr>

              <tr>
                <td><b>Action</b></td>
                <td>Automatic rollback initiated</td>
              </tr>

            </table>
